[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page application fallback.
# React Router owns every URL after the first load, so Netlify must return
# index.html for unknown paths. Without this rule, refreshing /movie/27205 or
# opening a shared link directly returns Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints every file in /assets, so those filenames can never change
# meaning — safe to cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
